<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no" />
    <meta name="theme-color" content="#0b1f18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="技能麻将 — 好好玩 要爆了。单机抽取或与好友开房间联机抽技能卡，仅供娱乐。" />
    <meta property="og:title" content="技能麻将" />
    <meta property="og:description" content="好好玩 要爆了 · 单机 / 联机房间" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/mahjong-bg.jpg" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>技能麻将</title>
    <!-- 微信内置浏览器常无法稳定加载 Google Fonts，优先系统中文字体 -->
    <link rel="stylesheet" href="css/style.css?v=20260924e" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <p class="brand">技能麻将</p>
        <p class="tagline">好好玩 要爆了</p>
      </header>

      <nav class="mode-nav" aria-label="模式切换">
        <button type="button" class="mode-nav__btn is-active" id="modeSolo">单机</button>
        <button type="button" class="mode-nav__btn" id="modeRoom">房间</button>
      </nav>

      <!-- ============ 单机模式（原逻辑保持不变） ============ -->
      <section class="screen" id="screenSolo" aria-label="单机模式">
        <section class="stage" aria-label="技能抽选">
          <div class="deck" id="deck">
            <div class="deck__glow"></div>
            <div class="deck__inner">
              <span class="deck__hint" id="deckHint">牌堆就绪</span>
              <p class="deck__text" id="deckText">点击下方「抽牌」发牌</p>
            </div>
          </div>

          <div class="stepper">
            <span class="stepper__label">每局抽取</span>
            <div class="stepper__ctrl">
              <button type="button" class="stepper__btn" id="nMinus" aria-label="减少数量">−</button>
              <span class="stepper__value" id="nValue">3</span>
              <button type="button" class="stepper__btn" id="nPlus" aria-label="增加数量">＋</button>
              <span class="stepper__unit">张</span>
            </div>
          </div>

          <p class="pool-meta" id="poolMeta">候选池 · 40 / 40</p>

          <div class="hand" id="hand" aria-label="你的手牌"></div>

          <div class="played" id="played" hidden aria-label="已发动技能">
            <h3 class="played__title">已发动技能</h3>
            <div class="played__list" id="playedList"></div>
          </div>

          <div class="controls">
            <button type="button" class="btn btn-primary" id="drawBtn">抽牌</button>
            <button type="button" class="btn btn-ghost" id="resetBtn">重置</button>
            <button type="button" class="btn btn-ghost" id="poolBtn">技能池</button>
          </div>
        </section>
      </section>

      <!-- ============ 房间模式（联机） ============ -->
      <section class="screen" id="screenRoom" hidden aria-label="房间模式">
        <!-- 大厅 -->
        <div id="roomLobby">
          <div class="server-row">
            <label class="server-row__label" for="serverUrl">服务器</label>
            <input
              class="server-row__input"
              id="serverUrl"
              type="text"
              inputmode="url"
              placeholder="ws://主机地址:3000（公网填 wss://…）"
              autocomplete="off"
            />
          </div>

          <div class="card-block">
            <h3 class="card-block__title">创建房间（你是房主）</h3>
            <input class="field" id="createName" type="text" placeholder="你的昵称" maxlength="20" />
            <div class="stepper">
              <span class="stepper__label">每人每局抽</span>
              <div class="stepper__ctrl">
                <button type="button" class="stepper__btn" id="roomNMinus" aria-label="减少">−</button>
                <span class="stepper__value" id="roomNValue">3</span>
                <button type="button" class="stepper__btn" id="roomNPlus" aria-label="增加">＋</button>
                <span class="stepper__unit">张</span>
              </div>
            </div>
            <button type="button" class="btn btn-ghost btn-block" id="roomPoolBtn">技能池 · 已选 35</button>
            <button type="button" class="btn btn-primary btn-block" id="createBtn">创建房间</button>
          </div>

          <div class="card-block">
            <h3 class="card-block__title">加入房间</h3>
            <input class="field" id="joinCode" type="text" inputmode="numeric" placeholder="6 位房间码" maxlength="6" />
            <input class="field" id="joinName" type="text" placeholder="你的昵称" maxlength="20" />
            <button type="button" class="btn btn-primary btn-block" id="joinBtn">加入房间</button>
          </div>

          <button type="button" class="btn btn-ghost btn-block" id="searchBtn">搜索本服房间</button>
          <div class="room-list" id="roomList" hidden></div>

          <p class="disclaimer">仅供娱乐 · 无赌博功能 · 无真实金钱交易</p>
          <p class="status" id="roomStatus" role="status" aria-live="polite"></p>
        </div>

        <!-- 房间内 -->
        <div id="roomView" hidden>
          <div class="room-header">
            <button type="button" class="room-code" id="roomCode" title="点击复制房间码">----</button>
            <div class="room-meta">
              <span id="roomRound">第 1 局</span>
              <span id="roomRole">玩家</span>
            </div>
            <div class="room-conn" id="roomConn"><span class="dot"></span><span class="txt">连接中…</span></div>
            <button type="button" class="icon-btn" id="leaveBtn" aria-label="离开房间">✕</button>
          </div>

          <div class="host-panel" id="hostPanel" hidden>
            <button type="button" class="btn btn-primary btn-block" id="startBtnRoom">开始游戏</button>
            <button type="button" class="btn btn-ghost btn-block" id="resetBtnRoom">重置本局（清空所有手牌）</button>
          </div>

          <!-- 东南西北罗盘座位：四个槽位 UI 固定，玩家在槽位间移动 -->
          <div class="seats" id="seats"></div>

          <p class="pregame-hint" id="preGameHint" hidden>
            等待房主「开始游戏」。下方为南方，玩家按东南西北就坐；点空位可换座位。开始后将自动发牌。
          </p>

          <section class="room-section" id="handSection" hidden>
            <h3 class="section-title">你的手牌</h3>
            <div class="hand" id="roomHand" aria-label="你的手牌"></div>
          </section>

          <section class="room-section" id="boardSection" hidden>
            <h3 class="section-title">已打出技能</h3>
            <div class="board" id="board">
              <p class="empty">还没有人打出技能</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <!-- 单机技能池弹窗 -->
    <div
      class="sheet"
      id="poolSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="poolTitle"
    >
      <div class="sheet__backdrop" id="sheetBackdrop"></div>
      <div class="sheet__panel">
        <header class="sheet__header">
          <div>
            <h2 id="poolTitle">技能池</h2>
            <p class="sheet__sub">勾选后进入抽奖候选 · 默认全选</p>
          </div>
          <button type="button" class="icon-btn" id="closePool" aria-label="关闭">✕</button>
        </header>
        <div class="sheet__toolbar">
          <button type="button" class="chip" id="selectAllBtn">全选</button>
          <button type="button" class="chip chip-muted" id="clearAllBtn">清空</button>
          <span class="sheet__count" id="sheetCount">已选 40</span>
        </div>
        <ul class="skill-list" id="skillList"></ul>
        <div class="sheet__footer">
          <button type="button" class="btn btn-primary btn-block" id="confirmPool">确认候选池</button>
        </div>
      </div>
    </div>

    <!-- 房间技能池弹窗 -->
    <div
      class="sheet"
      id="roomPoolSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="roomPoolTitle"
    >
      <div class="sheet__backdrop" id="roomPoolBackdrop"></div>
      <div class="sheet__panel">
        <header class="sheet__header">
          <div>
            <h2 id="roomPoolTitle">技能池</h2>
            <p class="sheet__sub">勾选本房间共用的候选技能 · 默认全选</p>
          </div>
          <button type="button" class="icon-btn" id="roomPoolClose" aria-label="关闭">✕</button>
        </header>
        <div class="sheet__toolbar">
          <button type="button" class="chip" id="roomSelectAll">全选</button>
          <button type="button" class="chip chip-muted" id="roomClearAll">清空</button>
          <span class="sheet__count" id="roomPoolCount">已选 35</span>
        </div>
        <ul class="skill-list" id="roomPoolList"></ul>
        <div class="sheet__footer">
          <button type="button" class="btn btn-primary btn-block" id="roomPoolConfirm">确认候选池</button>
        </div>
      </div>
    </div>

    <!-- 二次确认弹窗 -->
    <div class="confirm-modal" id="confirmModal" hidden role="alertdialog" aria-modal="true">
      <div class="confirm-modal__backdrop" id="confirmBackdrop"></div>
      <div class="confirm-modal__panel">
        <p class="confirm-modal__text" id="confirmText">确定执行？</p>
        <div class="confirm-modal__actions">
          <button type="button" class="btn btn-ghost" id="confirmCancel">取消</button>
          <button type="button" class="btn btn-primary" id="confirmOk">确认</button>
        </div>
      </div>
    </div>

    <!-- 由 server/index.js 在 HTTP 模式下注入真实 WS 地址；纯静态托管时保留占位符 -->
    <script>
      window.__WS_URL__ = "__MJ_WS_URL__";
    </script>
    <script src="js/config.js?v=20260924e"></script>
    <script src="js/skills.js?v=20260924e"></script>
    <script src="js/app.js?v=20260924e"></script>
    <script src="js/rooms.js?v=20260924e"></script>
  </body>
</html>
