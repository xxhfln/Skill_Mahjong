<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no" />
    <meta name="theme-color" content="#0b1f18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="技能麻将 — 好好玩 要爆了。随机抽取本局 N 张麻将技能规则，可逐张打出查看效果。" />
    <meta property="og:title" content="技能麻将" />
    <meta property="og:description" content="好好玩 要爆了" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/mahjong-bg.jpg" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>技能麻将</title>
    <!-- 微信内置浏览器常无法稳定加载 Google Fonts，优先系统中文字体 -->
    <link rel="stylesheet" href="css/style.css?v=20260923b" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <p class="brand">技能麻将</p>
        <p class="tagline">好好玩 要爆了</p>
      </header>

      <section class="stage" aria-label="技能抽选">
        <!-- 牌堆 / 抽取状态 -->
        <div class="deck" id="deck">
          <div class="deck__glow"></div>
          <div class="deck__inner">
            <span class="deck__hint" id="deckHint">牌堆就绪</span>
            <p class="deck__text" id="deckText">点击下方「抽牌」发牌</p>
          </div>
        </div>

        <!-- 抽取数量步进器 -->
        <div class="stepper">
          <span class="stepper__label">每局抽取</span>
          <div class="stepper__ctrl">
            <button type="button" class="stepper__btn" id="nMinus" aria-label="减少数量">
              −
            </button>
            <span class="stepper__value" id="nValue">3</span>
            <button type="button" class="stepper__btn" id="nPlus" aria-label="增加数量">
              ＋
            </button>
            <span class="stepper__unit">张</span>
          </div>
        </div>

        <p class="pool-meta" id="poolMeta">候选池 · 40 / 40</p>

        <!-- 手牌区 -->
        <div class="hand" id="hand" aria-label="你的手牌"></div>

        <!-- 已发动技能效果区 -->
        <div class="played" id="played" hidden aria-label="已发动技能">
          <h3 class="played__title">已发动技能</h3>
          <div class="played__list" id="playedList"></div>
        </div>

        <div class="controls">
          <button type="button" class="btn btn-primary" id="drawBtn">抽牌</button>
          <button type="button" class="btn btn-ghost" id="resetBtn">重置</button>
          <button type="button" class="btn btn-ghost" id="poolBtn">技能池</button>
        </div>
      </section>
    </main>

    <div
      class="sheet"
      id="poolSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="poolTitle"
    >
      <div class="sheet__backdrop" id="sheetBackdrop"></div>
      <div class="sheet__panel">
        <header class="sheet__header">
          <div>
            <h2 id="poolTitle">技能池</h2>
            <p class="sheet__sub">勾选后进入抽奖候选 · 默认全选</p>
          </div>
          <button type="button" class="icon-btn" id="closePool" aria-label="关闭">
            ✕
          </button>
        </header>

        <div class="sheet__toolbar">
          <button type="button" class="chip" id="selectAllBtn">全选</button>
          <button type="button" class="chip chip-muted" id="clearAllBtn">
            清空
          </button>
          <span class="sheet__count" id="sheetCount">已选 40</span>
        </div>

        <ul class="skill-list" id="skillList"></ul>

        <div class="sheet__footer">
          <button type="button" class="btn btn-primary btn-block" id="confirmPool">
            确认候选池
          </button>
        </div>
      </div>
    </div>

    <script src="js/skills.js?v=20260923b"></script>
    <script src="js/app.js?v=20260923b"></script>
  </body>
</html>
