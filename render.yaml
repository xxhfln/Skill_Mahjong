services:
  # Render Blueprint：把本文件提交到仓库后，在 Render 面板新建 Blueprint 即可一键部署
  # 注意：Blueprint 校验要求 runtime: node 必须显式写 startCommand，
  # 不能依赖「自动识别 package.json」（那只对手动创建生效），否则报
  # "runtime node must have startCommand" 且无法继续
  - type: web
    name: skill-mahjong
    runtime: node
    plan: free
    region: singapore # 离国内部署较近；也可改 frankfurt / oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    # package.json 里的 start 脚本即启动命令，Render 会自动识别
    envVars:
      - key: NODE_VERSION
        value: "22"
